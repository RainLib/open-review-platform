services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: openreview
      POSTGRES_USER: openreview
      POSTGRES_PASSWORD: openreview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreview -d openreview"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
      HTTP_ADDRESS: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
