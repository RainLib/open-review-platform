services:
  rabbitmq-volume-init:
    image: rabbitmq:4.1-management
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec", "chown -R rabbitmq:rabbitmq /var/lib/rabbitmq"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: openreview
      RABBITMQ_DEFAULT_PASS: openreview
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      rabbitmq-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: openreview
      POSTGRES_USER: openreview
      POSTGRES_PASSWORD: openreview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreview -d openreview"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
      HTTP_ADDRESS: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/outbox-relay"]
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
      RABBITMQ_URL: amqp://openreview:openreview@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  interaction-responder:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/interaction-responder"]
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
      RABBITMQ_URL: amqp://openreview:openreview@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    env_file: .env
    environment:
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
  rabbitmq-data:
