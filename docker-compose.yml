  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      <<: *provider-worker-environment
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
      RABBITMQ_URL: amqp://openreview:openreview@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-openreview.events}
      OPEN_REVIEW_BUILD_VERSION: ${OPEN_REVIEW_BUILD_VERSION:-development}
      # The runner executes in Linux, so it must not inherit a host-only Git
      # path such as /usr/local/opt/git/bin/git from a developer's .env file.
      GIT_BINARY: ${RUNNER_GIT_BINARY:-git}
      OCR_BINARY: ${OCR_BINARY:-ocr}
      OCR_VERSION: ${OCR_VERSION:-1.12.5}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      OCR_REVIEW_EFFORT: ${OCR_REVIEW_EFFORT:-low}
      OCR_MAX_PROMPT_TOKENS: ${OCR_MAX_PROMPT_TOKENS:-8000}
      OCR_MAX_TOKENS_BUDGET: ${OCR_MAX_TOKENS_BUDGET:-128000}
      OCR_SUBTASK_TIMEOUT_MINUTES: ${OCR_SUBTASK_TIMEOUT_MINUTES:-5}
      RISK_REVIEW_MODE: ${RISK_REVIEW_MODE:-focused}
      MERGE_GATE_MIN_SEVERITY: ${MERGE_GATE_MIN_SEVERITY:-critical}
      CHECKOUT_TIMEOUT: ${CHECKOUT_TIMEOUT:-2m}
      RUNNER_LEASE_DURATION: ${RUNNER_LEASE_DURATION:-2m}
      RUNNER_LEASE_RENEW_INTERVAL: ${RUNNER_LEASE_RENEW_INTERVAL:-30s}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-15m}
      RUNNER_ID: ${RUNNER_ID:-runner-1}
      RUNNER_POLL_INTERVAL: ${RUNNER_POLL_INTERVAL:-5s}
      OCR_LLM_URL: ${OCR_LLM_URL:-}
      OCR_LLM_TOKEN: ${OCR_LLM_TOKEN:-}
      OCR_LLM_MODEL: ${OCR_LLM_MODEL:-}
      OCR_USE_ANTHROPIC: ${OCR_USE_ANTHROPIC:-false}
      OPEN_REVIEW_MODEL_SECRET_PRIMARY: ${OPEN_REVIEW_MODEL_SECRET_PRIMARY:-}
    volumes: *provider-worker-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # OCR resolves its session store from the node user's home directory
      # rather than $HOME. Mount only that leaf on tmpfs to retain the runner's
      # read-only root filesystem while allowing a review to finalize.
      - /home/node/.opencodereview:uid=1000,gid=1000,mode=0700

  prometheus:
    image: prom/prometheus:v3.5.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      control-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/open-review-alerts.yml:/etc/prometheus/open-review-alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  agent-adapter-state:
  agent-adapter-workspaces:
    name: ${AGENT_ADAPTER_SANDBOX_WORKSPACE_VOLUME:-open-review-platform_agent-adapter-workspaces}

networks:
  agent-sandbox:
    name: ${AGENT_ADAPTER_SANDBOX_NETWORK:-open-review-platform_agent-sandbox}
    internal: true
