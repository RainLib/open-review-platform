name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          check-latest: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/...

  stack:
    needs: go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - name: Build and start the full local stack
        run: |
          docker compose up --build --detach
          trap 'docker compose logs --no-color; docker compose down --volumes' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
