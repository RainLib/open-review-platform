global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/open-review-alerts.yml

scrape_configs:
  - job_name: open-review-control-api
    static_configs:
      - targets: [control-api:8080]
  - job_name: open-review-rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
