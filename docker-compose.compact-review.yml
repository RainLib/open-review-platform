# Local development only: one supervised worker container for the PR/Issue
# review chain. Production must keep the split services and their independent
# deployment/credential boundaries. Combine this with docker-compose.core.yml.
services:
  outbox-relay:
    profiles: [split-review]
  acknowledger:
    profiles: [split-review]
  interaction-responder:
    profiles: [split-review]
  interaction-admitter:
    profiles: [split-review]
  terminal-reporter:
    profiles: [split-review]
  issue-publisher:
    profiles: [split-review]
  issue-triager:
    profiles: [split-review]
  provider-prober:
    profiles: [split-review]
  provider-feedback-poller:
    profiles: [split-review]
  runner:
    profiles: [split-review]
  rule-exception-expirer:
    profiles: [split-review]
  rule-rollout-monitor:
    profiles: [split-review]
  review-scheduler:
    profiles: [split-review]
  model-prober:
    profiles: [split-review]
  sso-prober:
    profiles: [split-review]
  data-governance-worker:
    profiles: [split-review]
  agent-task-source-admitter:
    profiles: [split-review]

  compact-review:
    image: ${OPEN_REVIEW_COMPACT_REVIEW_IMAGE:-open-review-platform-compact-review:local}
    build:
      context: .
      dockerfile: Dockerfile.compact-review
      args:
        REVIEW_RUNNER_IMAGE: ${OPEN_REVIEW_RUNNER_IMAGE:-open-review-platform-runner:latest}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OPEN_REVIEW_COMPACT_REVIEW: "true"
      OPEN_REVIEW_COMPACT_NOTIFICATIONS: ${OPEN_REVIEW_COMPACT_NOTIFICATIONS:-false}
      OPEN_REVIEW_COMPACT_DATA_GOVERNANCE: ${OPEN_REVIEW_COMPACT_DATA_GOVERNANCE:-false}
      OPEN_REVIEW_COMPACT_AGENT_SOURCE: ${OPEN_REVIEW_COMPACT_AGENT_SOURCE:-false}
      OPEN_REVIEW_BUILD_VERSION: ${OPEN_REVIEW_BUILD_VERSION:-development}
      OPEN_REVIEW_APP_URL: ${OPEN_REVIEW_APP_URL:-}
      CONTROL_DATABASE_URL: postgres://openreview:openreview@postgres:5432/openreview?sslmode=disable
      RABBITMQ_URL: amqp://openreview:openreview@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-openreview.events}
      OUTBOX_RELAY_ID: ${OUTBOX_RELAY_ID:-relay-1}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_CONTAINER_PATH:-/run/secrets/github-app.pem}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      GITLAB_ALLOW_HTTP: ${GITLAB_ALLOW_HTTP:-false}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_OAUTH_BASE_URL: ${GITLAB_OAUTH_BASE_URL:-}
      GITLAB_OAUTH_INTERNAL_BASE_URL: ${GITLAB_OAUTH_INTERNAL_BASE_URL:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
      AGENT_TASK_SOURCE_ADMITTER_WORKER_ID: ${AGENT_TASK_SOURCE_ADMITTER_WORKER_ID:-agent-task-source-admitter-1}
      AGENT_DECISION_JEV_URL: ${AGENT_DECISION_JEV_URL:-https://api.typesafe.ai/v1/systemone}
      AGENT_DECISION_JEV_API_KEY: ${AGENT_DECISION_JEV_API_KEY:-}
      AGENT_DECISION_JEV_MODEL: ${AGENT_DECISION_JEV_MODEL:-jev-latest}
      NOTIFIER_WORKER_ID: ${NOTIFIER_WORKER_ID:-notifier-1}
      OPENREVIEW_NOTIFY_PLATFORM: ${OPENREVIEW_NOTIFY_PLATFORM:-}
      OPENREVIEW_NOTIFY_ENGINEERING: ${OPENREVIEW_NOTIFY_ENGINEERING:-}
      OPENREVIEW_NOTIFY_SECURITY: ${OPENREVIEW_NOTIFY_SECURITY:-}
      OPENREVIEW_NOTIFY_INCIDENTS: ${OPENREVIEW_NOTIFY_INCIDENTS:-}
      OPENREVIEW_NOTIFY_RELEASES: ${OPENREVIEW_NOTIFY_RELEASES:-}
      OPENREVIEW_NOTIFY_PRODUCT: ${OPENREVIEW_NOTIFY_PRODUCT:-}
      OPEN_REVIEW_MODEL_SECRET_PRIMARY: ${OPEN_REVIEW_MODEL_SECRET_PRIMARY:-}
      MODEL_PROBER_WORKER_ID: ${MODEL_PROBER_WORKER_ID:-model-prober-1}
      MODEL_PROBE_POLL_INTERVAL: ${MODEL_PROBE_POLL_INTERVAL:-2s}
      MODEL_PROBE_ALLOW_PRIVATE_NETWORKS: ${MODEL_PROBE_ALLOW_PRIVATE_NETWORKS:-false}
      SSO_PROBER_WORKER_ID: ${SSO_PROBER_WORKER_ID:-sso-prober-1}
      SSO_PROBE_ALLOW_PRIVATE_NETWORKS: ${SSO_PROBE_ALLOW_PRIVATE_NETWORKS:-false}
      DATA_GOVERNANCE_ARTIFACT_KEY: ${DATA_GOVERNANCE_ARTIFACT_KEY:-}
      DATA_GOVERNANCE_ARTIFACT_TTL: ${DATA_GOVERNANCE_ARTIFACT_TTL:-24h}
      DATA_GOVERNANCE_EXPORT_MAX_RECORDS: ${DATA_GOVERNANCE_EXPORT_MAX_RECORDS:-10000}
      DATA_GOVERNANCE_REGION_ORCHESTRATOR_URL: ${DATA_GOVERNANCE_REGION_ORCHESTRATOR_URL:-}
      DATA_GOVERNANCE_REGION_ORCHESTRATOR_SECRET: ${DATA_GOVERNANCE_REGION_ORCHESTRATOR_SECRET:-}
      DATA_GOVERNANCE_REGION_ORCHESTRATOR_ALLOW_PRIVATE: ${DATA_GOVERNANCE_REGION_ORCHESTRATOR_ALLOW_PRIVATE:-false}
      DATA_GOVERNANCE_REGION_ORCHESTRATOR_ALLOW_HTTP: ${DATA_GOVERNANCE_REGION_ORCHESTRATOR_ALLOW_HTTP:-false}
      DATA_GOVERNANCE_REGION_ORCHESTRATOR_TIMEOUT: ${DATA_GOVERNANCE_REGION_ORCHESTRATOR_TIMEOUT:-20s}
      DATA_GOVERNANCE_REGION_POLL_INTERVAL: ${DATA_GOVERNANCE_REGION_POLL_INTERVAL:-30s}
      DATA_GOVERNANCE_WORKER_ID: ${DATA_GOVERNANCE_WORKER_ID:-data-governance-worker-1}
      OCR_LLM_URL: ${OCR_LLM_URL:-}
      OCR_LLM_TOKEN: ${OCR_LLM_TOKEN:-}
      OCR_LLM_MODEL: ${OCR_LLM_MODEL:-}
      OCR_USE_ANTHROPIC: ${OCR_USE_ANTHROPIC:-false}
      OCR_BINARY: ${OCR_BINARY:-ocr}
      OCR_VERSION: ${OCR_VERSION:-1.12.5}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      OCR_REVIEW_EFFORT: ${OCR_REVIEW_EFFORT:-low}
      OCR_MAX_PROMPT_TOKENS: ${OCR_MAX_PROMPT_TOKENS:-8000}
      OCR_MAX_TOKENS_BUDGET: ${OCR_MAX_TOKENS_BUDGET:-128000}
      OCR_SUBTASK_TIMEOUT_MINUTES: ${OCR_SUBTASK_TIMEOUT_MINUTES:-5}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-15m}
      GIT_BINARY: ${RUNNER_GIT_BINARY:-git}
      RISK_REVIEW_MODE: ${RISK_REVIEW_MODE:-focused}
      MERGE_GATE_MIN_SEVERITY: ${MERGE_GATE_MIN_SEVERITY:-critical}
      CHECKOUT_TIMEOUT: ${CHECKOUT_TIMEOUT:-2m}
      RUNNER_LEASE_DURATION: ${RUNNER_LEASE_DURATION:-2m}
      RUNNER_LEASE_RENEW_INTERVAL: ${RUNNER_LEASE_RENEW_INTERVAL:-30s}
      RUNNER_ID: ${RUNNER_ID:-runner-1}
      RUNNER_POLL_INTERVAL: ${RUNNER_POLL_INTERVAL:-5s}
      REVIEW_SCHEDULER_WORKER_ID: ${REVIEW_SCHEDULER_WORKER_ID:-review-scheduler-1}
      REVIEW_SCHEDULER_POLL_INTERVAL: ${REVIEW_SCHEDULER_POLL_INTERVAL:-1s}
      RULE_EXCEPTION_EXPIRER_WORKER_ID: ${RULE_EXCEPTION_EXPIRER_WORKER_ID:-rule-exception-expirer-1}
      RULE_EXCEPTION_EXPIRER_POLL_INTERVAL: ${RULE_EXCEPTION_EXPIRER_POLL_INTERVAL:-30s}
      RULE_EXCEPTION_EXPIRER_TENANT_LIMIT: ${RULE_EXCEPTION_EXPIRER_TENANT_LIMIT:-100}
      RULE_ROLLOUT_MONITOR_WORKER_ID: ${RULE_ROLLOUT_MONITOR_WORKER_ID:-rule-rollout-monitor-1}
      RULE_ROLLOUT_MONITOR_POLL_INTERVAL: ${RULE_ROLLOUT_MONITOR_POLL_INTERVAL:-30s}
      INTERACTION_RESPONDER_WORKER_ID: ${INTERACTION_RESPONDER_WORKER_ID:-interaction-responder-1}
      INTERACTION_ADMITTER_WORKER_ID: ${INTERACTION_ADMITTER_WORKER_ID:-interaction-admitter-1}
      PROVIDER_PROBER_WORKER_ID: ${PROVIDER_PROBER_WORKER_ID:-provider-prober-1}
      PROVIDER_PROBE_INTERVAL: ${PROVIDER_PROBE_INTERVAL:-5m}
      PROVIDER_PROBE_POLL_INTERVAL: ${PROVIDER_PROBE_POLL_INTERVAL:-5s}
      PROVIDER_PROBE_ALLOW_PRIVATE_NETWORKS: ${PROVIDER_PROBE_ALLOW_PRIVATE_NETWORKS:-false}
      PROVIDER_PROBE_ALLOW_HTTP: ${PROVIDER_PROBE_ALLOW_HTTP:-false}
      PROVIDER_FEEDBACK_POLLER_WORKER_ID: ${PROVIDER_FEEDBACK_POLLER_WORKER_ID:-provider-feedback-poller-1}
      PROVIDER_FEEDBACK_POLL_INTERVAL: ${PROVIDER_FEEDBACK_POLL_INTERVAL:-5m}
      PROVIDER_FEEDBACK_WORKER_INTERVAL: ${PROVIDER_FEEDBACK_WORKER_INTERVAL:-5s}
      PROVIDER_CHECKS_WORKER_ID: ${PROVIDER_CHECKS_WORKER_ID:-provider-checks-worker-1}
      PROVIDER_CHECKS_POLL_INTERVAL: ${PROVIDER_CHECKS_POLL_INTERVAL:-5m}
      PROVIDER_CHECKS_WORKER_INTERVAL: ${PROVIDER_CHECKS_WORKER_INTERVAL:-5s}
      PROVIDER_CHECKS_ALLOW_PRIVATE_NETWORKS: ${PROVIDER_CHECKS_ALLOW_PRIVATE_NETWORKS:-false}
      PROVIDER_CHECKS_ALLOW_HTTP: ${PROVIDER_CHECKS_ALLOW_HTTP:-false}
      ISSUE_TRIAGE_GITHUB_PUBLIC_BASE_URL: ${ISSUE_TRIAGE_GITHUB_PUBLIC_BASE_URL:-}
      ISSUE_TRIAGE_GITHUB_PUBLIC_FOR_API_BASE_URL: ${ISSUE_TRIAGE_GITHUB_PUBLIC_FOR_API_BASE_URL:-}
      ISSUE_TRIAGE_GITLAB_PUBLIC_BASE_URL: ${ISSUE_TRIAGE_GITLAB_PUBLIC_BASE_URL:-}
      ISSUE_TRIAGE_GITLAB_PUBLIC_FOR_API_BASE_URL: ${ISSUE_TRIAGE_GITLAB_PUBLIC_FOR_API_BASE_URL:-}
    volumes:
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-${GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}}
        target: ${GITHUB_APP_PRIVATE_KEY_CONTAINER_PATH:-/run/secrets/github-app.pem}
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.opencodereview:uid=1000,gid=1000,mode=0700
